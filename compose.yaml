# ALGO_DEX en production : Caddy (HTTPS) → site Next → moteur Django → PostgreSQL, plus une sauvegarde quotidienne.
# Seul Caddy est exposé (ports 80 et 443). Variables : fichier .env à côté (voir .env.example).

services:
  base:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algodex}
      POSTGRES_USER: ${POSTGRES_USER:-algodex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  moteur:
    build: ./django-docker
    restart: unless-stopped
    depends_on:
      base:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY manquant dans .env}
      # Seuls le back-office (Caddy) et le relais du site (« moteur ») parlent au moteur.
      DJANGO_ALLOWED_HOSTS: ${DOMAINE_ADMIN:?DOMAINE_ADMIN manquant dans .env},moteur
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAINE_ADMIN}
      DJANGO_CHEMIN_ADMIN: ${DJANGO_CHEMIN_ADMIN:-gestion-algodex/}
      # HTTPS est géré par Caddy ; Django ne redirige pas lui-même (le relais Next parle en http).
      DJANGO_DERRIERE_HTTPS: "1"
      DJANGO_REDIRECTION_HTTPS: "0"
      # Caddy puis Next devant Django.
      DJANGO_NB_PROXIES: "2"
      POSTGRES_DB: ${POSTGRES_DB:-algodex}
      POSTGRES_USER: ${POSTGRES_USER:-algodex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: base
      POSTGRES_PORT: "5432"
    expose:
      - "8000"

  # Export quotidien de la base (cahier des charges, section 14) : deploiement/sauvegardes/, 14 jours gardés.
  sauvegarde:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      base:
        condition: service_healthy
    environment:
      PGHOST: base
      PGDATABASE: ${POSTGRES_DB:-algodex}
      PGUSER: ${POSTGRES_USER:-algodex}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploiement/sauvegardes:/sauvegardes
      - ./deploiement/sauvegarder.sh:/sauvegarder.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /sauvegarder.sh; sleep 86400; done"]

  site:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://moteur:8000
    restart: unless-stopped
    depends_on:
      - moteur
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - site
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINE: ${DOMAINE:?DOMAINE manquant dans .env}
      DOMAINE_ADMIN: ${DOMAINE_ADMIN}
      DJANGO_CHEMIN_ADMIN: ${DJANGO_CHEMIN_ADMIN:-gestion-algodex/}
    volumes:
      - ./deploiement/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_donnees:/data
      - caddy_config:/config

volumes:
  donnees:
  caddy_donnees:
  caddy_config:
